services:
  - type: web
    name: jadrixservs-bot-v4
    runtime: docker
    plan: starter
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSWORD
        sync: false
      - key: COOKIE_SECRET
        generateValue: true
      - key: DATA_DIR
        value: /data
      - key: MEDIA_DIR
        value: /data/media
      - key: BOT_TIMEZONE
        value: America/Lima
      - key: GREETING_COOLDOWN_HOURS
        value: "24"
      - key: REMINDER_CHECK_MINUTES
        value: "15"
    disk:
      name: jadrixservs-data
      mountPath: /data
      sizeGB: 1
