services:
  - type: web
    name: whatsapp-qr-render-bot
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ADMIN_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: SESSION_PATH
        value: /data/baileys_auth
      - key: DATA_DIR
        value: /data/bot-control
      - key: WA_LOG_LEVEL
        value: silent
