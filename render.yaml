services:
  - type: web
    name: jadrixservs-bot-v4
    runtime: docker
    plan: starter
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSWORD
        sync: false
      - key: COOKIE_SECRET
        generateValue: true
      - key: AUTHENTICATOR_ENCRYPTION_KEY
        sync: false
      - key: DATA_DIR
        value: /data
      - key: MEDIA_DIR
        value: /data/media
      - key: BOT_TIMEZONE
        value: America/Lima
      - key: REMINDER_CHECK_MINUTES
        value: "15"
      - key: HUMAN_DELAY_MIN_MS
        value: "900"
      - key: HUMAN_DELAY_MAX_MS
        value: "4200"
      - key: WHATSAPP_READY_TIMEOUT_MS
        value: "45000"
      - key: WHATSAPP_RECONNECT_DELAY_MS
        value: "3000"
    disk:
      name: jadrixservs-data
      mountPath: /data
      sizeGB: 1
